<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit Template · SuratApp</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand">SuratApp</a>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="arsip.html">Arsip</a>
      <a href="template.html" class="active">Template</a>
    </nav>
  </div>
</header>

<main class="container" id="app"></main>

<script src="data.js"></script>
<script>
const app = document.getElementById("app");
const key = new URLSearchParams(location.search).get("key");
const isNew = !key;

const tpl = isNew
  ? { key: "", nama: "", template: "<h3>JUDUL SURAT</h3>\n<p>Nomor: {{nomor_surat}}</p>\n<p>{{signer_jabatan}}</p>", fields: [] }
  : getTemplate(key);

if (!tpl) {
  app.innerHTML = '<div class="empty">Template tidak ditemukan.</div>';
} else {
  render();
}

function render() {
  app.innerHTML = `
    <div class="row-between mb-4">
      <div>
        <h1 class="page-title">${isNew ? "Template Baru" : "Edit Template"}</h1>
        <p class="page-sub">${tpl.nama || "-"}</p>
      </div>
      <a class="btn" href="template.html">Kembali</a>
    </div>

    <div class="section">
      <div class="section-title">Info Template</div>
      <div class="form-group">
        <label>Key</label>
        <input type="text" id="key" value="${tpl.key}" ${isNew ? "" : "disabled"} placeholder="mis: konfirmasi_akta">
        <div class="hint">Identifier unik, huruf kecil, tanpa spasi.</div>
      </div>
      <div class="form-group">
        <label>Nama</label>
        <input type="text" id="nama" value="${tpl.nama}">
      </div>
    </div>

    <div class="section">
      <div class="section-title">Template HTML</div>
      <div class="form-group">
        <textarea id="template" rows="16" style="font-family:ui-monospace,Menlo,monospace;font-size:13px">${escapeHtml(tpl.template)}</textarea>
        <div class="hint">
          Placeholder tersedia:
          <code>{{nomor_surat}}</code>
          <code>{{signer_nama}}</code>
          <code>{{signer_jabatan}}</code>
          <code>{{signer_nip}}</code>
          dan semua nama field di bawah.
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Field</div>
      <div id="fields"></div>
      <button class="btn btn-sm mt-2" type="button" onclick="addField()">+ Tambah Field</button>
    </div>

    <div class="row-between mt-4">
      <a class="btn" href="template.html">Batal</a>
      <button class="btn btn-primary" onclick="simpan()">Simpan</button>
    </div>
  `;
  renderFields();
}

function renderFields() {
  const el = document.getElementById("fields");
  if (tpl.fields.length === 0) {
    el.innerHTML = '<div class="muted mb-2">Belum ada field.</div>';
    return;
  }
  el.innerHTML = tpl.fields.map((f, i) => `
    <div class="row mb-2" style="align-items:flex-end">
      <div class="form-group" style="flex:1;margin:0">
        <label>Nama</label>
        <input type="text" value="${f.name}" onchange="upd(${i},'name',this.value)">
      </div>
      <div class="form-group" style="flex:1;margin:0">
        <label>Label</label>
        <input type="text" value="${f.label}" onchange="upd(${i},'label',this.value)">
      </div>
      <div class="form-group" style="width:130px;margin:0">
        <label>Tipe</label>
        <select onchange="upd(${i},'type',this.value)">
          ${["text","textarea","date","select"].map(t =>
            `<option ${f.type === t ? "selected" : ""}>${t}</option>`).join("")}
        </select>
      </div>
      <div class="form-group" style="width:100px;margin:0">
        <label>Wajib</label>
        <select onchange="upd(${i},'required',this.value==='1')">
          <option value="0" ${!f.required ? "selected" : ""}>Tidak</option>
          <option value="1" ${f.required ? "selected" : ""}>Ya</option>
        </select>
      </div>
      <button class="btn btn-sm btn-danger" type="button" onclick="delField(${i})">Hapus</button>
    </div>
  `).join("");
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

window.addField = () => {
  tpl.fields.push({ name: "field_" + (tpl.fields.length + 1), label: "Field Baru", type: "text", required: false });
  renderFields();
};
window.delField = (i) => { tpl.fields.splice(i, 1); renderFields(); };
window.upd = (i, k, v) => { tpl.fields[i][k] = v; };

window.simpan = () => {
  const k = document.getElementById("key").value.trim();
  const nama = document.getElementById("nama").value.trim();
  const template = document.getElementById("template").value;

  if (!k)   return alert("Key wajib diisi.");
  if (!nama) return alert("Nama wajib diisi.");
  if (isNew && getTemplate(k)) return alert("Key sudah dipakai.");

  upsertTemplate({
    key: isNew ? k : tpl.key,
    nama,
    template,
    fields: tpl.fields
  });
  location.href = "template.html";
};
</script>
</body>
</html>
