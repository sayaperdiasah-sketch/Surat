<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard · SuratApp</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand">SuratApp</a>
    <nav>
      <a href="index.html" class="active">Dashboard</a>
      <a href="arsip.html">Arsip</a>
      <a href="template.html">Template</a>
    </nav>
  </div>
</header>

<main class="container">
  <h1 class="page-title">Dashboard</h1>
  <p class="page-sub">Pilih kategori untuk mulai bekerja.</p>

  <div class="categories">
    <a class="category" href="buat.html">
      <h3>Buat Surat</h3>
      <p>Bikin surat baru dari template yang tersedia.</p>
    </a>
    <a class="category" href="template.html">
      <h3>Edit Isi Surat</h3>
      <p>Ubah template dan field surat.</p>
    </a>
  </div>

  <h2 style="font-size:15px;margin:0 0 12px">Surat Terakhir</h2>
  <div class="card" id="recent"></div>
</main>

<script src="data.js"></script>
<script>
  const list = getLetters().slice(0, 5);
  const el = document.getElementById("recent");
  if (list.length === 0) {
    el.innerHTML = '<div class="empty">Belum ada surat.</div>';
  } else {
    el.innerHTML = `
      <table>
        <thead><tr><th>Nomor</th><th>Jenis</th><th>Dibuat</th><th></th></tr></thead>
        <tbody>
          ${list.map(l => `
            <tr>
              <td>${l.nomor_surat || "-"}</td>
              <td>${getTemplate(l.template_key)?.nama || l.template_key}</td>
              <td>${new Date(l.created_at).toLocaleDateString("id-ID")}</td>
              <td><a class="btn btn-sm" href="preview.html?id=${l.id}">Lihat</a></td>
            </tr>
          `).join("")}
        </tbody>
      </table>`;
  }
</script>
</body>
</html>
